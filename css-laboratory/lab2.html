<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Selectors Lab</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>
  <h1 id="page-title">Learning CSS Selectors</h1>

  <h2>Element Selectors</h2>
  <h3>Class Selectors</h3>

  <div class="card">
    <p>Element selectors target every tag of a given type, such as all paragraphs.</p>
  </div>

  <div class="card">
    <p class="highlight">Class selectors target any element that has the matching class.</p>
  </div>

  <div class="card">
    <p>ID selectors target one unique element on the page.</p>
  </div>
</body>
</html>

<!--Reflection:
The .card is a class selector that starts with a dot (.) and can be applied to multiple HTML elements, 
making it useful for styling repeated elements with the same design. In this activity, all three <div> 
elements use the same class. On the other hand, #page-title is an ID selector that starts with a hash (#) 
and should be used only once on a page because it identifies a specific element, such as the main heading.
IDs can also be used for navigation links to specific sections of a webpage and in JavaScript.-->
