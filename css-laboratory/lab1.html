<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First CSS Page</title>
  <link rel="stylesheet" href="style1.css">
    <style>
        h1 {
        color: darkblue;
        }
    </style>
</head>
<body>
  <h1>My First CSS Page</h1>
  <p style="font-style: italic; border-left: 4px solid darkblue; padding-left: 10px;">
    CSS (Cascading Style Sheets) is used to control the appearance of web pages,
    including colors, fonts, spacing, and layout.
  </p>

  <p>
    CSS separates content (HTML) from presentation, which makes websites easier
    to maintain, more consistent, and faster to update.
  </p>
</body>
</html>

<!-- Reflection:
 Inline CSS is written directly inside an HTML element using the style attribute and affects only that specific element. 
 Internal CSS is written inside a <style> tag in the <head> section and applies to a single HTML page. 
 External CSS is written in a separate .css file and linked to the HTML document, allowing the same styles to be applied to multiple pages. -->

 <!--I would use external CSS for a website with multiple pages because it allows all pages to share the same stylesheet,
  making the design consistent throughout the website. It is also easier to maintain and update because changes made in one 
  CSS file can automatically apply to all linked pages. Additionally, it keeps the HTML code organized by separating the content 
  from the design and improves loading performance because browsers can cache the external stylesheet.-->
