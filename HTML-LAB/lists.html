<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML LISTS</title>
</head>
<body>
    <h2>UNORDERED LISTS OF FRUITS</h2>
        <ul>
            <li>Melon</li>
            <li>Banana</li>
            <li>Watermelon</li>
            <li>Apple</li>
            <li>Grapes</li>
        </ul>

    <h2>ORDERED LISTS OF FRUITS</h2>
        <ol>
            <li>Melon</li>
            <li>Banana</li>
            <li>Watermelon</li>
            <li>Apple</li>
            <li>Grapes</li>
        </ol>

    <h2>NESTED LISTS OF FRUITS</h2>
        <ul>
            <li>Melon</li>
            <li>Banana
        <ul>
            <li>Watermelon</li>
            <li>Apple</li>
        </ul>
        </li>
            <li>Grapes</li>
        </ul>

</body>
</html>
